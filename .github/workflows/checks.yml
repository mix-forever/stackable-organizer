name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version

      # Every part builds, with no errors, no warnings and a non-empty solid.
      # A missing module is a warning in OpenSCAD, not an error, so checking
      # for errors alone would not catch it.
      - name: Every part builds
        run: sh tools/check_presets.sh

      # The parts actually fit each other: a drawer in its slot, past the
      # catches, and a label plate in its pocket.
      - name: Parts fit each other
        run: sh tools/check_fit.sh

      # The examples in stl/ are what the current code produces. Volumes are
      # compared, not bytes: the triangulation of the same solid can differ
      # between runs.
      - name: Examples are up to date
        run: |
          cat > /tmp/volumes.py <<'PY'
          import glob
          def vol(path):
              t = []; c = []
              for line in open(path, 'rb'):
                  s = line.split()
                  if s and s[0] == b'vertex':
                      c.append(tuple(float(v) for v in s[1:4]))
                      if len(c) == 3: t.append(c); c = []
              return abs(sum((a[0]*(b[1]*d[2]-b[2]*d[1]) - a[1]*(b[0]*d[2]-b[2]*d[0])
                              + a[2]*(b[0]*d[1]-b[1]*d[0])) / 6 for a, b, d in t))
          for f in sorted(glob.glob('stl/*.stl')):
              print('%s %.3f' % (f, vol(f)))
          PY
          python3 /tmp/volumes.py > /tmp/before.txt
          sh tools/build_examples.sh
          python3 /tmp/volumes.py > /tmp/after.txt
          diff /tmp/before.txt /tmp/after.txt \
            || { echo "stl/ is out of date — run sh tools/build_examples.sh"; exit 1; }
